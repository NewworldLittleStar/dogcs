<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味小站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
:root{--bg:#f4f7ff;--text:#222;--card:#fff;--accent:#4285f4}
.dark{--bg:#12141d;--text:#e8edff;--card:#1e2233;--accent:#589eff}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:30px 15px;transition:0.3s}
.container{max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 4px 16px #00000015}
h2{margin-bottom:16px;color:var(--accent)}
.btn{border:none;background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;margin:6px;cursor:pointer}
.btn:active{opacity:0.85}
#result{font-family:monospace;font-size:18px;padding:12px;background:#00000010;border-radius:10px;margin:12px 0;word-break:break-all}
.foot{text-align:center;margin-top:40px;opacity:0.6;font-size:14px}
#egg{margin-top:14px;color:#f59e0b;display:none}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>🎲 随机串生成器</h2>
    <p>生成 10位【数字+大小写字母】随机串</p>
    <div id="result">点击下方按钮生成</div>
    <button class="btn" onclick="genStr()">生成随机串</button>
    <button class="btn" onclick="copyText()">复制</button>
  </div>

  <div class="card">
    <h2>🌓 明暗切换</h2>
    <button class="btn" onclick="toggleDark()">切换暗黑/浅色</button>
  </div>

  <div class="card">
    <h2>✨ 彩蛋</h2>
    <p>连续点标题5次触发惊喜</p>
    <div id="egg">🎉 你找到隐藏彩蛋啦！本站纯静态，免费托管于Pages</div>
  </div>

  <div class="foot">
    静态趣味小站 · 无后端 · 无需数据库
  </div>
</div>

<script>
// 字符池：数字+大写+小写
const pool = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
let output = "";

function genStr(){
  let s = "";
  for(let i=0;i<10;i++){
    s += pool[Math.floor(Math.random()*pool.length)]
  }
  output = s;
  document.getElementById("result").innerText = s;
}
function copyText(){
  if(!output) return alert("先生成！");
  navigator.clipboard.writeText(output).then(()=>alert("复制成功"))
}
function toggleDark(){
  document.documentElement.classList.toggle("dark")
}

// 彩蛋计数
let clickCount = 0;
document.querySelector("h2").addEventListener("click",()=>{
  clickCount++;
  if(clickCount >=5){
    document.getElementById("egg").style.display="block";
  }
})
</script>
</body>
</html>
