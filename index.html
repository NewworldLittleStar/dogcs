/* ================= 状态与逻辑 ================= */
let idx=0, scores={EI:0,SN:0,TF:0,JP:0}, userCode="";

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function backHome(){ idx=0; scores={EI:0,SN:0,TF:0,JP:0}; show('screen-intro'); }

function startQuiz(){ idx=0; scores={EI:0,SN:0,TF:0,JP:0}; show('screen-quiz'); renderQ(); }

function renderQ(){
  const q=QUESTIONS[idx];
  document.getElementById('qCount').textContent=`${idx+1} / ${QUESTIONS.length}`;
  document.getElementById('progressFill').style.width=((idx)/QUESTIONS.length*100)+'%';
  document.getElementById('qScene').textContent="📍 "+q.s;
  document.getElementById('qTitle').textContent=q.q;
  const box=document.getElementById('optBox'); box.innerHTML='';
  const keys=['A','B','C','D'];
  q.o.forEach((opt,i)=>{
    const div=document.createElement('div');
    div.className='opt';
    div.innerHTML=`<span class="key">${keys[i]}</span><span>${opt[0]}</span>`;
    div.onclick=()=>pick(opt,div);
    box.appendChild(div);
  });
}

function pick(opt,el){
  document.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='none');
  el.classList.add('chosen');
  scores[opt[1]]+=opt[2];
  setTimeout(()=>{
    idx++;
    document.getElementById('progressFill').style.width=(idx/QUESTIONS.length*100)+'%';
    if(idx>=QUESTIONS.length) finish();
    else renderQ();
  },280);
}

function calcCode(){
  const dims=[['E','I','EI'],['S','N','SN'],['T','F','TF'],['J','P','JP']];
  return dims.map(([a,b,k])=>scores[k]>=0?a:b).join('');
}

function finish(){
  show('loading');
  setTimeout(()=>{
    userCode=calcCode();
    const d=DOGS[userCode]||DOGS.INFP;
    document.getElementById('rDog').textContent=d.dog;
    document.getElementById('rCode').textContent="DOG-MBTI · "+d.code;
    document.getElementById('rName').textContent=d.name;
    document.getElementById('rSlogan').textContent=d.slogan;
    document.getElementById('rTags').innerHTML=d.tags.map(t=>`<span># ${t}</span>`).join('');
    document.getElementById('rAdvice').textContent=d.advice;
    // 灵魂搭子
    const best=DOGS[d.best.split(' ')[0]];
    if(best){ document.getElementById('mDog').textContent=best.dog; document.getElementById('mName').textContent=best.name+"（"+best.code+"）"; }
    // 维度条
    const bars=[['外向 E','内向 I',scores.EI],['实感 S','直觉 N',scores.SN],['感性 F','理性 T',-scores.TF],['感知 P','计划 J',-scores.JP]];
    document.getElementById('rBars').innerHTML=bars.map(([l,r,v])=>{
      const pct=Math.min(95,Math.max(5,50+v*9));
      return `<div class="bar-row"><div class="bar-label"><span>${l}</span><span>${r}</span></div>
        <div class="bar-track"><div class="bar-val" style="width:${pct}%"></div></div></div>`;
    }).join('');
    show('screen-result');
  },1400);
}

function copyResult(){
  const d=DOGS[userCode];
  const text=`🐶 我在 DogTi 测出的小狗人格是【${d.name}】(${d.code})！\n"${d.slogan}"\n标签：${d.tags.map(t=>'#'+t).join(' ')}\n👉 快来测测你是哪只小狗！`;
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject())
    .then(()=>alert('已复制！去粘贴给小伙伴吧 🐾'))
    .catch(()=>{ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); alert('已复制！去粘贴给小伙伴吧 🐾'); });
}

function voteNext(){
  const themes=['🐈 猫咪MBTI','🦊 狐狸MBTI','🐰 兔兔MBTI','🦖 恐龙MBTI'];
  const pick=prompt('投票下一期测什么？\n1 猫咪MBTI\n2 狐狸MBTI\n3 兔兔MBTI\n4 恐龙MBTI\n（输入数字）');
  if(pick) alert(`收到！「${themes[pick-1]||'神秘主题'}」+1 票，敬请期待！🗳️`);
}
