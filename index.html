/* ================= 状态与逻辑 ================= */
let idx = 0;
let scores = { EI:0, SN:0, TF:0, JP:0 };
let userCode = "";

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function backHome(){
  idx = 0;
  scores = { EI:0, SN:0, TF:0, JP:0 };
  show('screen-intro');
}

function startQuiz(){
  idx = 0;
  scores = { EI:0, SN:0, TF:0, JP:0 };
  show('screen-quiz');
  renderQ();
}

function renderQ(){
  var q = QUESTIONS[idx];
  document.getElementById('qCount').textContent = (idx+1) + " / " + QUESTIONS.length;
  document.getElementById('progressFill').style.width = (idx / QUESTIONS.length * 100) + '%';
  document.getElementById('qScene').textContent = "📍 " + q.s;
  document.getElementById('qTitle').textContent = q.q;
  var box = document.getElementById('optBox');
  box.innerHTML = '';
  var keys = ['A','B','C','D'];
  q.o.forEach(function(opt, i){
    var div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = '<span class="key">' + keys[i] + '</span><span>' + opt[0] + '</span>';
    div.onclick = function(){ pick(opt, div); };
    box.appendChild(div);
  });
}

function pick(opt, el){
  document.querySelectorAll('.opt').forEach(function(o){ o.style.pointerEvents = 'none'; });
  el.classList.add('chosen');
  scores[opt[1]] += opt[2];
  setTimeout(function(){
    idx++;
    document.getElementById('progressFill').style.width = (idx / QUESTIONS.length * 100) + '%';
    if(idx >= QUESTIONS.length){ finish(); }
    else { renderQ(); }
  }, 280);
}

function calcCode(){
  var code = '';
  code += (scores.EI >= 0) ? 'E' : 'I';
  code += (scores.SN >= 0) ? 'S' : 'N';
  code += (scores.TF >= 0) ? 'F' : 'T';
  code += (scores.JP >= 0) ? 'P' : 'J';
  return code;
}

function finish(){
  show('loading');
  setTimeout(function(){
    userCode = calcCode();
    var d = DOGS[userCode] || DOGS.INFP;
    document.getElementById('rDog').textContent = d.dog;
    document.getElementById('rCode').textContent = "DOG-MBTI · " + userCode;
    document.getElementById('rName').textContent = d.name;
    document.getElementById('rSlogan').textContent = d.slogan;
    document.getElementById('rTags').innerHTML = d.tags.map(function(t){ return '<span># ' + t + '</span>'; }).join('');
    document.getElementById('rAdvice').textContent = d.advice;

    var best = DOGS[d.best];
    if(best){
      document.getElementById('mDog').textContent = best.dog;
      document.getElementById('mName').textContent = best.name + "（" + d.best + "）";
    }

    var bars = [
      ['外向 E','内向 I', scores.EI],
      ['实感 S','直觉 N', scores.SN],
      ['感性 F','理性 T', -scores.TF],
      ['感知 P','计划 J', -scores.JP]
    ];
    document.getElementById('rBars').innerHTML = bars.map(function(b){
      var pct = Math.min(95, Math.max(5, 50 + b[2] * 9));
      return '<div class="bar-row"><div class="bar-label"><span>' + b[0] + '</span><span>' + b[1] + '</span></div>' +
             '<div class="bar-track"><div class="bar-val" style="width:' + pct + '%"></div></div></div>';
    }).join('');

    show('screen-result');
  }, 1400);
}

function copyResult(){
  var d = DOGS[userCode];
  var text = "🐶 我在 DogTi 测出的小狗人格是【" + d.name + "】(" + userCode + ")！\n“" + d.slogan + "”\n标签：" + d.tags.map(function(t){ return '#' + t; }).join(' ') + "\n👉 快来测测你是哪只小狗！";
  function ok(){ alert('已复制！去粘贴给小伙伴吧 🐾'); }
  function fallback(){
    var t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    t.remove();
    ok();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  } else {
    fallback();
  }
}

function voteNext(){
  var pickNum = prompt('投票下一期测什么？\n1 猫咪MBTI\n2 狐狸MBTI\n3 兔兔MBTI\n4 恐龙MBTI\n（输入数字）');
  var themes = { '1':'🐈 猫咪MBTI', '2':'🦊 狐狸MBTI', '3':'🐰 兔兔MBTI', '4':'🦖 恐龙MBTI' };
  if(pickNum){
    alert('收到！「' + (themes[pickNum] || '神秘主题') + '」+1 票，敬请期待！🗳️');
  }
}
